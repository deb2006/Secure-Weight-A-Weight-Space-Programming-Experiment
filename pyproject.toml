[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secureweight"
version = "0.1.0"
description = "Reproducible healthy neural-network testbed for SecureWeight research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3", "numpy>=2.1,<3", "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
secureweight = "secureweight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
